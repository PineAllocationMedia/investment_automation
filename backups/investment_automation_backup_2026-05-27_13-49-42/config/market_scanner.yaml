scanner_note: "Le scanner analyse seulement l’univers fourni ou la liste par défaut. Il ne couvre pas tout le marché."
auto_discovery:
  enabled: true
  cache_max_age_hours: 168
  max_auto_candidates_for_analysis: 80
  source_timeout_seconds: 5
  sources:
    - name: nasdaq100_wikipedia
      url: "https://en.wikipedia.org/wiki/Nasdaq-100"
      priority: 5
    - name: sp500_wikipedia
      url: "https://en.wikipedia.org/wiki/List_of_S%26P_500_companies"
      priority: 4
    - name: tsx60_wikipedia
      url: "https://en.wikipedia.org/wiki/S%26P/TSX_60"
      ticker_suffix: ".TO"
      priority: 3
