name: Baseline V1 CI

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Obtain exact pinned PIT source objects for test parent
        shell: bash
        run: |
          set -euo pipefail
          fetch_pit_source() {
            local lineage="$1" revision="$2" ref="$3"
            if git cat-file -e "${revision}^{commit}" 2>/dev/null; then
              echo "PIT_PIN_BEFORE_FETCH ${lineage} ${revision} PRESENT"
            else
              echo "PIT_PIN_BEFORE_FETCH ${lineage} ${revision} ABSENT"
            fi
            # Only these exact commits, one level each; refs stay local to CI.
            git fetch --no-tags --no-recurse-submodules --depth=1 origin "${revision}:${ref}"
            test "$(git rev-parse --verify "${ref}^{commit}")" = "$revision"
            git cat-file -e "${revision}^{tree}"
            echo "PIT_PIN_FETCH_VERIFIED ${lineage} ${revision}"
          }
          fetch_pit_source V1 c5fc27c82c29c2a6027eccee245098c4a072fdf1 refs/pit-proof/v1
          fetch_pit_source V2 a95ff74fe0cd448d4b4436dc8506363caabac9d0 refs/pit-proof/v2

      - name: Set up frozen Python version
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock

      - name: Compile Python sources
        run: python -m compileall -q main.py src scripts tests

      - name: Run complete test suite
        run: python -m unittest discover -s tests -q

      - name: Check whitespace errors
        run: git diff --check HEAD^
