name: Macro Lens Visual Kit CI

"on":
  pull_request:
    paths:
      - "docs/marketing/visual_kit/**"
      - "docs/marketing/MACRO_LENS_PLAYBOOK.md"
      - "docs/marketing/MACRO_LENS_TEMPLATES.md"
      - ".github/workflows/macro_lens_visual_kit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renderer:
    name: Validate offline Blossom visual renderer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout proposed PR changes
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned PNG renderer only
        run: python -m pip install "PyMuPDF==1.28.2"

      - name: Verify PNG renderer is actually available
        run: python -c "import fitz; print('PyMuPDF:', fitz.VersionBind)"

      - name: Compile isolated marketing renderer and tests
        run: python -m compileall -q docs/marketing/visual_kit

      - name: Run actual Visual Kit regression tests
        working-directory: docs/marketing/visual_kit
        run: python -m unittest discover -s tests -v

      - name: Render T1 Classic/Research Note/Evidence+ and T2/T3 as SVG and PNG
        working-directory: docs/marketing/visual_kit
        shell: bash
        run: |
          set -euo pipefail
          for template in t1 t1_research_note t1_evidence_plus t2 t3; do
            python render_macro_lens.py "examples/${template}_synthetic.json" \
              --output "$RUNNER_TEMP/${template}_demo.svg" \
              --png "$RUNNER_TEMP/${template}_demo.png"
            test -s "$RUNNER_TEMP/${template}_demo.svg"
            test -s "$RUNNER_TEMP/${template}_demo.png"
          done

      - name: Render M4 cross-asset demo as SVG and PNG
        working-directory: docs/marketing/visual_kit
        shell: bash
        run: |
          set -euo pipefail
          for sample in m4 m4_four_row; do
            python render_market_brief.py "examples/${sample}_synthetic.json" \
              --output "$RUNNER_TEMP/${sample}_demo.svg" \
              --png "$RUNNER_TEMP/${sample}_demo.png"
            test -s "$RUNNER_TEMP/${sample}_demo.svg"
            test -s "$RUNNER_TEMP/${sample}_demo.png"
            grep -q 'DRAFT' "$RUNNER_TEMP/${sample}_demo.svg"
            grep -q 'MARKET BRIEF' "$RUNNER_TEMP/${sample}_demo.svg"
          done

      - name: Prepare 390px synthetic M4 mobile proofs
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import fitz
          folder=Path(os.environ['RUNNER_TEMP'])
          for name in ('m4','m4_four_row'):
              svg=(folder/f'{name}_demo.svg').read_bytes()
              page=fitz.open(stream=svg,filetype='svg')[0]
              pix=page.get_pixmap(matrix=fitz.Matrix(390/1080,390/1080),alpha=False)
              assert pix.width == 390 and pix.height >= 487
              pix.save(folder/f'{name}_390px.png')
          PY

      - name: Save synthetic M4 previews for CEO visual review
        uses: actions/upload-artifact@v4
        with:
          name: m4-synthetic-research-plate-previews
          path: |
            ${{ runner.temp }}/m4_demo.png
            ${{ runner.temp }}/m4_390px.png
            ${{ runner.temp }}/m4_four_row_demo.png
            ${{ runner.temp }}/m4_four_row_390px.png
          retention-days: 7
          if-no-files-found: error
      - name: Render synthetic M2 sector rotation and mobile proof
        working-directory: docs/marketing/visual_kit
        shell: bash
        run: |
          set -euo pipefail
          python render_sector_rotation.py examples/m2_synthetic.json \
            --output "$RUNNER_TEMP/m2_synthetic.svg" \
            --png "$RUNNER_TEMP/m2_synthetic.png"
          grep -q 'DRAFT' "$RUNNER_TEMP/m2_synthetic.svg"
          grep -q 'SECTOR ROTATION' "$RUNNER_TEMP/m2_synthetic.svg"
          python - <<'PY'
          import os
          from pathlib import Path
          import fitz
          folder=Path(os.environ['RUNNER_TEMP'])
          svg=(folder/'m2_synthetic.svg').read_bytes()
          page=fitz.open(stream=svg,filetype='svg')[0]
          pix=page.get_pixmap(matrix=fitz.Matrix(390/1080,390/1080),alpha=False)
          assert pix.width == 390 and pix.height >= 487
          pix.save(folder/'m2_390px.png')
          PY

      - name: Save M2 synthetic proofs for CEO visual review
        uses: actions/upload-artifact@v4
        with:
          name: m2-sector-rotation-synthetic-previews
          path: |
            ${{ runner.temp }}/m2_synthetic.svg
            ${{ runner.temp }}/m2_synthetic.png
            ${{ runner.temp }}/m2_390px.png
          retention-days: 7
          if-no-files-found: error
      - name: Render M1 Natural Earth index-first world map and mobile proof
        working-directory: docs/marketing/visual_kit
        shell: bash
        run: |
          set -euo pipefail
          python render_global_index_map.py examples/m1_global_index_synthetic.json \
            --output "$RUNNER_TEMP/m1_global_index_synthetic.svg" \
            --png "$RUNNER_TEMP/m1_global_index_synthetic.png"
          grep -q 'DRAFT' "$RUNNER_TEMP/m1_global_index_synthetic.svg"
          grep -q 'GLOBAL EQUITY MAP' "$RUNNER_TEMP/m1_global_index_synthetic.svg"
          python - <<'PY'
          import os
          from pathlib import Path
          import fitz
          folder=Path(os.environ['RUNNER_TEMP'])
          svg=(folder/'m1_global_index_synthetic.svg').read_bytes()
          page=fitz.open(stream=svg,filetype='svg')[0]
          pix=page.get_pixmap(matrix=fitz.Matrix(390/1080,390/1080),alpha=False)
          assert pix.width==390 and pix.height >= 487
          pix.save(folder/'m1_global_index_390px.png')
          PY

      - name: Upload synthetic M1 global index map proofs for CEO review
        uses: actions/upload-artifact@v4
        with:
          name: m1-global-index-map-synthetic-previews
          path: |
            ${{ runner.temp }}/m1_global_index_synthetic.svg
            ${{ runner.temp }}/m1_global_index_synthetic.png
            ${{ runner.temp }}/m1_global_index_390px.png
          retention-days: 7
          if-no-files-found: error
      - name: Confirm synthetic content remains visibly watermarked
        shell: bash
        run: |
          set -euo pipefail
          for template in t1 t1_research_note t1_evidence_plus t2 t3; do
            grep -q "DRAFT" "$RUNNER_TEMP/${template}_demo.svg"
          done
